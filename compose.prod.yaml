services:
  tracking:
    image: ${SERVICE_IMAGE:?Set SERVICE_IMAGE}
    env_file: .env
    volumes:
      - ./keys:/app/keys:ro
      - ./certs:/app/certs:ro
    networks: [platform]
    init: true
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
networks:
  platform:
    external: true
    name: tablebooking-platform
